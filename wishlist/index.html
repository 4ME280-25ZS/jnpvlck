<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist — Prototype</title>
  <style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}h1{color:#333}</style>
</head>
<body>
  <main class="container">
    <h1>wishlist</h1>
    <p class="intro">Choose a gift and click <strong>I'll buy</strong>. Enter your name to reserve it. You can cancel or change your reservation anytime.</p>

    <ul id="items" class="items" aria-live="polite"></ul>

    <template id="item-template">
      <li class="item">
        <div class="info">
          <div class="title"></div>
          <div class="desc"></div>
        </div>
        <div class="actions">
          <div class="status"></div>
          <button class="reserve">I'll buy</button>
        </div>
        <form class="name-form hidden">
          <input name="name" class="name-input" placeholder="Your name" required />
          <button type="submit" class="save">Save</button>
          <button type="button" class="cancel">Cancel</button>
        </form>
      </li>
    </template>
  </main>

  <!-- Load Supabase client from multiple CDNs with fallback, then initialize -->
  <script>
    (function(){
      const cdns = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js',
        'https://unpkg.com/@supabase/supabase-js/dist/supabase.min.js'
      ];
      const SUPABASE_URL = 'https://pvgdsnandhesqzmvgede.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2Z2RzbmFuZGhlc3F6bXZnZWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3ODcwNjksImV4cCI6MjA4MzM2MzA2OX0.-h6fv0n8I8q5WQlJ4asfg7j2-hf-CX98_uWxO4MJjUw';

      function loadScript(src){
        return new Promise((resolve,reject)=>{
          const s = document.createElement('script');
          s.src = src; s.async = false; s.onload = () => resolve(); s.onerror = () => reject();
          document.head.appendChild(s);
        });
      }

      (async ()=>{
        let loaded = false;
        for(const src of cdns){
          try{ await loadScript(src); loaded = true; break; } catch(e){ /* try next */ }
        }
        if(loaded && typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY){
          try{ window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
          catch(e){ console.warn('Failed to create supabase client', e); window.supabaseClient = null; }
        } else {
          window.supabaseClient = null;
          console.warn('Supabase client not available (CDN failed or keys missing)');
        }
        // after initialization, load the app script
        const app = document.createElement('script'); app.src = 'script.js'; app.defer = true; document.body.appendChild(app);
      })();
    })();
  </script>
</body>
</html>
